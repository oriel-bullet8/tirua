<body data-pagina="carta">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <noscript><p class="sin-js">Este sitio necesita JavaScript para mostrar el menú y la carta.</p></noscript>

  <header class="cabecera es-solida" data-cabecera>
    <p class="aviso" data-texto="aviso"></p>
    <div class="cabecera__fila">

      </a>
      <nav class="menu" id="menu-principal" aria-label="Principal" data-menu>
        <ul class="menu__lista" data-nav></ul>
      </nav>
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    <section class="cp" aria-labelledby="cp-titulo">
      <div class="envoltura">
        <!-- Solo en el PDF: logo y datos del local (se llenan desde js/contenido.js) -->
        <div class="cp-print-cab" aria-hidden="true">
          <img data-logo="cabecera" alt="">
          <p data-cp-local></p>
        </div>
        <header class="cp__cab">
          <h1 class="titular titular--medio" id="cp-titulo">Carta</h1>
          <p class="seccion__bajada">Para compartir, platos, postres y todo lo que se brinda en Tirúa.</p>
          <p class="cp__nota" data-cp-nota></p>
          <label class="cp-busca">
            <span class="solo-lectores">Buscar en la carta</span>
            <svg class="cp-busca__ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input class="cp-busca__in" type="search" data-cp-buscar placeholder="Buscar en la carta" autocomplete="off" enterkeyhint="search">
          </label>
        </header>
      </div>

      <!-- Barra fija: un acceso por bloque y buscador -->
      <div class="cp-barra" data-cp-barra>
        <div class="envoltura cp-barra__in">
          <nav class="cp-nav" aria-label="Bloques de la carta">
            <ul class="cp-nav__lista" data-cp-nav></ul>
          </nav>
        </div>
      </div>

      <div class="envoltura">
        <div data-cp-contenido></div>
        <p class="cp__vacio" data-cp-vacio hidden>No encontramos nada con esa búsqueda.</p>
        <p class="solo-lectores" role="status" aria-live="polite" data-cp-estado></p>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="envoltura">
      <div class="pie__fila">
        <a class="marca pie__marca" href="index.html" aria-label="Tirúa, ir al inicio"><img data-logo="cabecera" alt=""></a>
